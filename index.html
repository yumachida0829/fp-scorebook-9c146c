<!doctype html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='robots' content='noindex, nofollow'>
</head>
<body>
<title>野球スコアブック</title>
<style>
:root {
  --bg: #F6F7FA;
  --surface: #FFFFFF;
  --surface2: #EDF0F5;
  --ink: #182132;
  --ink2: #4F5B72;
  --ink3: #8C96A9;
  --line: #E2E6EE;
  --accent: #1E3A6E;
  --accent-soft: #E8EDF7;
  --on-accent: #FFFFFF;
  --hit: #2E7D50;
  --xbh: #B07E14;
  --out: #3D68AF;
  --danger: #B03A2E;
  --board: #142950;
  --board-ink: #F4F7FC;
  --board-line: #24417A;
  --shadow: 0 1px 3px rgba(20,30,50,.07), 0 4px 14px rgba(20,30,50,.04);
  --font-num: "DIN Alternate", "Bahnschrift", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :where(:root) {
    --bg: #15201A;
    --surface: #1D2B23;
    --surface2: #23342A;
    --ink: #ECF2EC;
    --ink2: #A3B4A8;
    --ink3: #75857A;
    --line: #2C3B31;
    --accent: #37A278;
    --accent-soft: #24402F;
    --on-accent: #0C1811;
    --hit: #37A278;
    --xbh: #C08A2A;
    --out: #5E8BD6;
    --danger: #E07A6E;
    --board: #101B14;
    --board-ink: #E8F0E6;
    --board-line: #24402F;
    --shadow: 0 1px 3px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1420;
  --surface: #16202F;
  --surface2: #1D2A3D;
  --ink: #E9EDF5;
  --ink2: #A5B1C6;
  --ink3: #71809A;
  --line: #27344B;
  --accent: #6D99DF;
  --accent-soft: #21334F;
  --on-accent: #0A1424;
  --hit: #37A278;
  --xbh: #B8842B;
  --out: #5E8BD6;
  --danger: #E07A6E;
  --board: #0A1120;
  --board-ink: #E9EDF5;
  --board-line: #21334F;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F6F7FA;
  --surface: #FFFFFF;
  --surface2: #EDF0F5;
  --ink: #182132;
  --ink2: #4F5B72;
  --ink3: #8C96A9;
  --line: #E2E6EE;
  --accent: #1E3A6E;
  --accent-soft: #E8EDF7;
  --on-accent: #FFFFFF;
  --hit: #2E7D50;
  --xbh: #B07E14;
  --out: #3D68AF;
  --danger: #B03A2E;
  --board: #142950;
  --board-ink: #F4F7FC;
  --board-line: #24417A;
  --shadow: 0 1px 3px rgba(20,30,50,.07), 0 4px 14px rgba(20,30,50,.04);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--ink); }

/* ── scoreboard header ── */
header.board {
  background: var(--board);
  color: var(--board-ink);
  padding: 16px 16px 8px;
}
header.board .board-top { display: flex; align-items: baseline; gap: 10px; max-width: 860px; margin: 0 auto; }
header.board .app-label { font-size: 11px; letter-spacing: .18em; opacity: .7; }
header.board h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: .02em; }
header.board .season { font-family: var(--font-num); font-size: 13px; opacity: .75; letter-spacing: .08em; }
.sync-badge {
  margin-left: auto; font-size: 10.5px; font-weight: 600; letter-spacing: .05em;
  padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.13); color: var(--board-ink); opacity: .9;
}
.sync-badge[data-mode="off"] { background: rgba(255,255,255,.06); opacity: .6; }
.sync-badge[data-mode="ok"]::before { content: "● "; color: #7ED9A6; font-size: 8px; vertical-align: 1px; }

nav.tabs {
  position: sticky; top: 0; z-index: 20;
  background: var(--board);
  border-bottom: 1px solid var(--board-line);
  display: flex; justify-content: center; gap: 0;
}
nav.tabs .tabs-inner { display: flex; max-width: 860px; width: 100%; padding: 6px 8px 8px; gap: 4px; }
nav.tabs button {
  flex: 1; background: none; border: none; color: var(--board-ink);
  padding: 8px 4px; font-size: 13px; font-weight: 600; opacity: .6;
  border-radius: 9px;
}
nav.tabs button.active { opacity: 1; background: rgba(255,255,255,.14); }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

main { max-width: 860px; margin: 0 auto; padding: 16px 14px 90px; }

/* ── common ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 15px 17px; margin-bottom: 14px; }
.card h2 { font-size: 13px; letter-spacing: .12em; color: var(--ink2); margin: 0 0 10px; font-weight: 700; }
.card h2 .h2-runs { margin-left: 8px; color: var(--accent); letter-spacing: 0; }
table.line-score { border-collapse: collapse; font-size: 13.5px; min-width: 220px; }
table.line-score th, table.line-score td { padding: 3px 9px; text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
table.line-score th { color: var(--ink3); font-size: 11px; font-weight: 600; }
table.line-score td.ls-team { font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink2); text-align: left; padding-left: 0; white-space: nowrap; }
table.line-score .ls-total { font-weight: 700; font-size: 15px; border-left: 1px solid var(--line); }
table.line-score .ls-stat { color: var(--ink3); font-size: 12px; }
table.lineup { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.lineup th, table.lineup td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.lineup th { color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: .06em; }
table.lineup td.num, table.lineup th:first-child { text-align: center; font-family: var(--font-num); }
table.lineup .lu-name { font-weight: 600; white-space: nowrap; }
table.lineup .lu-bats { margin-left: 5px; font-size: 10.5px; color: var(--ink3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.eyebrow { font-size: 11px; letter-spacing: .15em; color: var(--ink3); font-weight: 600; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 600;
}
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.link { color: var(--accent); text-decoration: none; font-weight: 600; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 11px 13px 9px; }
.tile .t-label { font-size: 11px; letter-spacing: .1em; color: var(--ink2); font-weight: 600; }
.tile .t-value { font-family: var(--font-num); font-size: 27px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .t-sub { font-size: 11px; color: var(--ink3); }

/* table */
.tbl-wrap { overflow-x: auto; }
table.stats { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
table.stats th, table.stats td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.stats th { color: var(--ink2); font-size: 11.5px; letter-spacing: .06em; font-weight: 600; position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; }
table.stats th.sorted { color: var(--accent); }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.stats td.name { font-family: inherit; font-weight: 600; }
table.stats tr.rowlink { cursor: pointer; }
table.stats tr.rowlink:hover td { background: var(--surface2); }

/* player detail stat grid */
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 22px; }
.sg-cell { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.sg-l { font-size: 12.5px; color: var(--ink2); }
.sg-v { font-size: 16px; font-variant-numeric: tabular-nums; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.res-hit.on { background: var(--hit); border-color: var(--hit); }
.chip.res-out.on { background: var(--out); border-color: var(--out); color: #fff; }
.chip.res-xbh.on { background: var(--xbh); border-color: var(--xbh); color: #fff; }

/* PA log */
.pa-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.pa-row:last-child { border-bottom: none; }
.pa-inning { font-family: var(--font-num); color: var(--ink3); width: 34px; flex: none; text-align: right; }
.pa-name { font-weight: 600; min-width: 90px; }
.badge {
  display: inline-block; border-radius: 5px; padding: 1px 8px; font-size: 12.5px; font-weight: 700;
  background: var(--surface2); color: var(--ink2); flex: none;
}
.badge.b-hit { background: var(--hit); color: var(--on-accent); }
.badge.b-xbh { background: var(--xbh); color: #fff; }
.badge.b-walk { background: var(--accent-soft); color: var(--accent); }
.pa-detail { color: var(--ink2); font-size: 13px; white-space: nowrap; }
.pa-note { color: var(--xbh); font-size: 12.5px; flex-basis: 100%; order: 10; margin-left: 44px; line-height: 1.4; }
.pa-actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
.icon-btn { border: none; background: none; color: var(--ink3); font-size: 13px; padding: 3px 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--surface2); color: var(--ink); }
.icon-btn.del:hover { color: var(--danger); }

/* forms */
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; letter-spacing: .08em; color: var(--ink2); font-weight: 700; margin-bottom: 5px; }
input[type=text], input[type=date], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  padding: 8px 10px;
}
textarea { min-height: 130px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: none; background: var(--surface2); width: 36px; height: 34px; font-size: 17px; color: var(--ink); }
.stepper .stepper-v { width: 44px; text-align: center; font-family: var(--font-num); font-size: 16px; }
.check-row { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.check-row input { width: 18px; height: 18px; accent-color: var(--accent); }

/* charts */
.chart-note { font-size: 12px; color: var(--ink3); margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.legend .li { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
svg text { font-family: var(--font-num); fill: var(--ink2); }
svg .jp { font-family: inherit; }
.tooltip {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--ink); color: var(--bg); border-radius: 7px; padding: 5px 10px;
  font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 240px; line-height: 1.45;
}
.tooltip .tt-num { font-family: var(--font-num); }

.empty { color: var(--ink3); text-align: center; padding: 26px 10px; font-size: 14px; }
.game-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.game-row:last-child { border-bottom: none; }
.game-row:hover { background: var(--surface2); }
.game-date { font-family: var(--font-num); color: var(--ink2); width: 78px; flex: none; font-size: 13px; }
.game-vs { font-weight: 700; }
.game-score { margin-left: auto; font-family: var(--font-num); font-size: 17px; }
.game-wl { font-size: 11.5px; font-weight: 700; border-radius: 5px; padding: 1px 7px; flex: none; }
.game-wl.w { background: var(--accent-soft); color: var(--accent); }
.game-wl.l { background: var(--surface2); color: var(--ink3); }
.game-wl.d { background: var(--surface2); color: var(--ink2); }

.steps { counter-reset: step; }
.step { display: flex; gap: 12px; margin-bottom: 14px; }
.step .n {
  counter-increment: step; flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); font-family: var(--font-num);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
}
.step .n::before { content: counter(step); }
.step h3 { margin: 1px 0 4px; font-size: 14.5px; }
.step p { margin: 0; font-size: 13.5px; color: var(--ink2); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  opacity: 0; transition: opacity .25s; z-index: 60; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

.back { margin-bottom: 10px; }
.hdr-flex { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hdr-flex .spacer { flex: 1; }
.subtle { color: var(--ink3); font-size: 12.5px; }
.import-preview { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 14px; margin-top: 12px; background: var(--accent-soft); }
.import-preview h3 { margin: 0 0 6px; font-size: 14.5px; }
.warn-text { color: var(--xbh); font-weight: 600; font-size: 13px; }
.err-text { color: var(--danger); font-weight: 600; font-size: 13.5px; white-space: pre-wrap; }
@media (max-width: 560px) {
  .row3 { grid-template-columns: 1fr 1fr; }
  main { padding: 12px 10px 90px; }
  .pa-name { min-width: 72px; }
}
</style>

<header class="board">
  <div class="board-top">
    <span class="app-label">SCOREBOOK</span>
    <h1 id="team-name-h">チーム</h1>
    <span class="sync-badge" id="sync-badge" data-mode="init">読み込み中…</span>
    <span class="season num" id="season-y"></span>
  </div>
</header>
<nav class="tabs" aria-label="メイン">
  <div class="tabs-inner">
    <button data-tab="stats">成績</button>
    <button data-tab="games">試合</button>
    <button data-tab="input">打席入力</button>
    <button data-tab="import">取り込み</button>
  </div>
</nav>
<main id="main"></main>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ───────────────────────── data ───────────────────────── */
const LS_KEY = "yakyu-scorebook-v1";

const RESULTS = {
  "単打":   { cat: "hit",  bases: 1 },
  "二塁打": { cat: "hit",  bases: 2 },
  "三塁打": { cat: "hit",  bases: 3 },
  "本塁打": { cat: "hit",  bases: 4 },
  "四球":   { cat: "bb" },
  "死球":   { cat: "hbp" },
  "三振":   { cat: "out", so: true },
  "ゴロ":   { cat: "out", batted: true },
  "フライ": { cat: "out", batted: true },
  "ライナー": { cat: "out", batted: true },
  "併殺打": { cat: "out", batted: true },
  "犠打":   { cat: "sac", batted: true },
  "犠飛":   { cat: "sf",  batted: true },
  "失策":   { cat: "roe", batted: true },
  "野選":   { cat: "fc",  batted: true },
};
const RESULT_KEYS = Object.keys(RESULTS);
const DIRS = ["投","捕","一","二","三","遊","左","中","右"];

let uidSeq = 0;
const uid = p => p + "_" + Date.now().toString(36) + "_" + (uidSeq++).toString(36);

// 打ち方（スコアブックの R/L 列）。未記載は右
const SEED_BATS = { p7: "左", p9: "左", p14: "左" };
// 守備の初期データ: [playerIdx, side, 打順, 守備位置(交代順), note]
function seedFielding() {
  const rows = [
    [1,"T",1,["遊"],""],
    [2,"T",2,["投"],"要確認: シート欄は1(投)。大人投手の場合は修正を"],
    [3,"T",3,["左"],""],
    [4,"T",4,["右"],""],
    [5,"T",5,["二","三"],""],
    [6,"T",6,["三"],"要確認: 交代先が判読不能"],
    [7,"T",7,["一","二"],""],
    [8,"T",8,["中","一"],""],
    [9,"B",1,["投","二"],"要確認: シート欄は1(投)。大人投手の場合は修正を"],
    [10,"B",2,["左"],""],
    [11,"B",3,["二"],""],
    [12,"B",4,["右"],""],
    [13,"B",5,["左"],"要確認: なぎと同じ左と判読。誤読の可能性"],
    [14,"B",6,["中","投"],"要確認: 交代先が1(投)と判読"],
    [15,"B",7,["捕","一"],""],
    [16,"B",8,["三"],""],
    [17,"B",9,["一","遊"],""],
    [18,"B",10,["遊"],"要確認: 交代先が判読不能"],
  ];
  return rows.map((r, i) => ({
    id: "g1_f" + i, gameId: "g1", playerId: "p" + r[0],
    side: r[1], order: r[2], positions: r[3], errors: 0, note: r[4] || "",
  }));
}

function sampleData() {
  // 2026-07-26 紅白戦（林試の森）— 紙スコアブックのAI読み取り結果
  const players = [
    "まなと","けんご","じょう","こうや","ありた","しゅうじ","はる","なつき",
    "りょうたろ","なぎ","きみと","だいち","こうだい","いっさ","いおり","しんのすけ","あき","なおや"
  ].map((name, i) => ({ id: "p" + (i + 1), name, number: null, bats: SEED_BATS["p" + (i + 1)] || "右" }));
  const games = [
    { id: "g1", date: "2026-07-26", opponent: "紅白戦（林試の森）", scoreFor: 5, scoreAgainst: 4 },
  ];
  // [playerIdx(1-18), inning, result, direction, rbi, run, note, 盗塁数]
  const raw = [
    [1,1,"単打","三",0,1,"",1],
    [2,1,"野選","捕",0,1,"要確認: 2FC(捕の野選)と判読",1],
    [3,1,"ゴロ","遊",0,0,"要確認: 6-3。この間の生還なら打点1"],
    [4,1,"ゴロ","一",0,0,"要確認: 3A。打点の可能性"],
    [5,1,"三振","",0,0,"要確認: 振り逃げ2-3でアウトと判読"],
    [6,2,"失策","投",0,1,"1-3Eで出塁と判読",1],
    [7,2,"三振","",0,0,""],
    [8,2,"ゴロ","投",0,0,"要確認: 1-3。犠打の可能性"],
    [1,2,"三塁打","左",0,1,""],
    [2,2,"失策","遊",0,1,"6Eで出塁と判読"],
    [3,2,"失策","遊",0,0,"要確認: 単打の可能性",1],
    [4,2,"三振","",0,0,"要確認: 2TO(振り逃げタッチアウト?)"],
    [9,1,"単打","中",0,0,"ライナー性(ℓ/8)",1],

  }));
  return { teamName: "不動パイレーツEチーム", players, games, atBats, fielding: seedFielding(), dataRev: DATA_REV };

const DATA_REV = 5;
function migrate(s) {
  const rev = s.dataRev || 1;
  if (rev >= DATA_REV) return s;
  if (rev < 2) {
    // v2: 7/26紅白戦の長打修正（保護者確認）。該当行が未編集の場合のみ書き換える
    const fixes = {
      g1_ab5:  { was: "単打", result: "失策",   direction: "投", note: "1-3Eで出塁と判読" },
      g1_ab8:  { was: "単打", result: "三塁打", direction: "左", note: "" },
      g1_ab20: { was: "野選", result: "三塁打", direction: "右", note: "" },
      g1_ab22: { was: "単打", result: "二塁打", direction: "右", note: "" },
    };
    for (const a of s.atBats || []) {
      const f = fixes[a.id];
      if (f && a.result === f.was) { a.result = f.result; a.direction = f.direction; a.note = f.note; }
    }
  }
  if (rev < 3) {
    // v3: 紅白戦の打席に表/裏を付与（1枚目のチーム=表、2枚目=裏）
    for (const a of s.atBats || []) {
      const m = /^g1_ab(\d+)$/.exec(a.id || "");
      if (m && a.side === undefined) a.side = (+m[1] <= 11) ? "T" : "B";
    }
  }
  if (rev < 4) {
    // v4: 7/26紅白戦のスコアブックのS'記号（盗塁）を反映
    const sbFix = { g1_ab0: 1, g1_ab1: 1, g1_ab5: 1, g1_ab10: 1, g1_ab12: 1, g1_ab17: 1 };
    for (const a of s.atBats || []) {
      if (a.sb === undefined) a.sb = sbFix[a.id] || 0;
      if (a.cs === undefined) a.cs = 0;
    }
  }
  if (rev < 5) {
    // v5: 守備記録（シート列）と打ち方（R/L列）を追加
    if (!Array.isArray(s.fielding)) {
      s.fielding = (s.games || []).some(g => g.id === "g1") ? seedFielding() : [];
    }
    for (const p of s.players || []) {
      if (p.bats === undefined && /^p([1-9]|1[0-8])$/.test(p.id || "")) p.bats = SEED_BATS[p.id] || "右";
    }
  }
  s.dataRev = DATA_REV;
  return s;
}

/* ── 共有データ同期（Firebase Realtime Database）──
   誰でも編集OK方式: このURLを開いた全員が同じデータを読み書きする。
   最後に保存した内容が勝つ（last-write-wins）。オフライン時はこの端末のみに保存。 */
const SYNC_URL = "https://fp-scorebook-9c146c-default-rtdb.asia-southeast1.firebasedatabase.app";
function setSync(mode, label) {
  const el = document.getElementById("sync-badge");
  if (el) { el.dataset.mode = mode; el.textContent = label; }
}
function fetchT(url, opts, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  return fetch(url, { ...opts, signal: ctl.signal }).finally(() => clearTimeout(t));
}
async function remotePull() {
  try {
    const res = await fetchT(SYNC_URL + "/state.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const remote = await res.json();
    if (remote && remote.players && remote.games && remote.atBats) {
      const remoteRev = remote.dataRev || 1;
      state = migrate(remote);
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      setSync("ok", "同期済み");
      render();
      if (state.dataRev !== remoteRev) pushRemote(); // マイグレーション結果を共有側にも反映
      dailyBackup();
    } else if (remote === null) {
      pushRemote(); // リモートが空なら手元のデータを種として送る
    } else {
      setSync("off", "オフライン（この端末のみ）");
    }
  } catch (e) {
    setSync("off", "オフライン（この端末のみ）");
  }
}
let pushTimer = null;
function pushRemote() {
  clearTimeout(pushTimer);
  setSync("saving", "保存中…");
  pushTimer = setTimeout(async () => {
    try {
      state.updatedAt = new Date().toISOString();
      const res = await fetchT(SYNC_URL + "/state.json", { method: "PUT", body: JSON.stringify(state) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setSync("ok", "同期済み");
    } catch (e) {
      setSync("off", "オフライン（この端末のみ）");
    }
  }, 800);
}
async function dailyBackup() {
  // その日最初の閲覧時に共有データのスナップショットを残す（消してしまった時の復元用）
  try {
    const day = new Date().toISOString().slice(0, 10);
    const r = await fetchT(`${SYNC_URL}/backups/${day}.json?shallow=true`);
    if (r.ok && (await r.json()) === null) {
      await fetchT(`${SYNC_URL}/backups/${day}.json`, { method: "PUT", body: JSON.stringify(state) });
    }
  } catch (e) {}
}

function calcStats(abs) {
  const s = { pa:0, ab:0, h:0, b1:0, b2:0, b3:0, hr:0, rbi:0, run:0, bb:0, hbp:0, so:0, tb:0, sac:0, sf:0, dp:0, sb:0, cs:0 };
  const gids = new Set();
  for (const a of abs) {
    const r = RESULTS[a.result]; if (!r) continue;
    s.pa++;
    gids.add(a.gameId);
    s.rbi += a.rbi || 0;
    s.sb += a.sb || 0;
    s.cs += a.cs || 0;
    if (a.run) s.run++;
    if (r.cat === "bb") { s.bb++; continue; }
    if (r.cat === "hbp") { s.hbp++; continue; }
    if (r.cat === "sac") { s.sac++; continue; }
    if (r.cat === "sf") { s.sf++; continue; }
    s.ab++;
    if (r.so) s.so++;
    if (a.result === "併殺打") s.dp++;
    if (r.cat === "hit") {
      s.h++; s.tb += r.bases;
      if (r.bases === 1) s.b1++; else if (r.bases === 2) s.b2++;
      else if (r.bases === 3) s.b3++; else s.hr++;
    }
  }
  s.games = gids.size;
  s.bb4d = s.bb + s.hbp;
  s.avg = s.ab ? s.h / s.ab : null;
  const obpDen = s.ab + s.bb + s.hbp + s.sf;
  s.obp = obpDen ? (s.h + s.bb + s.hbp) / obpDen : null;
  s.slg = s.ab ? s.tb / s.ab : null;
  s.ops = (s.obp !== null && s.slg !== null) ? s.obp + s.slg : null;
  return s;
}
const fmtRate = v => v === null ? "—" : (v >= 1 ? v.toFixed(3) : v.toFixed(3).replace(/^0/, ""));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const gameOf = id => state.games.find(g => g.id === id);
const playerOf = id => state.players.find(p => p.id === id);
const sortedGames = () => [...state.games].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
const absOfGame = gid => state.atBats.filter(a => a.gameId === gid);

const fieldingOfGame = gid => (state.fielding || []).filter(f => f.gameId === gid);
const fieldingOfPlayer = pid => (state.fielding || []).filter(f => f.playerId === pid);
const fmtDate = d => d ? d.replace(/^\d{4}-/, "").replace("-", "/") : "";
// 紅白戦など対外試合でないものは「vs」を付けない
const vsLabel = opp => { const o = String(opp || "不明"); return o.includes("紅白戦") ? o : "vs " + o; };

function bindTooltips(root) {

    el.addEventListener("mouseenter", e => { tt.innerHTML = el.dataset.tt; tt.style.display = "block"; moveTT(e); });
    el.addEventListener("mousemove", moveTT);

  });
}
function moveTT(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;

  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}

function sprayChartSVG(abs) {
  const batted = abs.filter(a => {
    const r = RESULTS[a.result];
    return r && (r.cat === "hit" || r.batted) && FIELD_POS[a.direction];
  });
  const counts = {};
  // draw outs first so hit marks (and HR labels) stay on top
  const zOrder = a => { const r = RESULTS[a.result]; return r.cat === "hit" ? 1 : 0; };
  batted.sort((a, b) => zOrder(a) - zOrder(b));
  const marks = batted.map(a => {
    const key = a.direction;
    const idx = counts[key] = (counts[key] || 0) + 1;
    const [bx, by] = FIELD_POS[key];
    // deterministic ring layout around the position for multiple balls
    let x = bx, y = by;
    if (idx > 1) {
      const ring = Math.floor((idx - 2) / 6), slot = (idx - 2) % 6;
      const ang = slot * Math.PI / 3 + ring * 0.5, rad = 13 + ring * 11;
      x = bx + rad * Math.cos(ang); y = by + rad * Math.sin(ang);
    }
    const r = RESULTS[a.result];
    const g = gameOf(a.gameId);
    const label = `${g ? fmtDate(g.date) : ""} ${a.inning}回 ${esc(a.result)}（${esc(a.direction)}）`;
    let cls = "spray-out", shape;
    if (r.cat === "hit" && r.bases >= 2) {
      shape = `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--xbh)" stroke="var(--surface)" stroke-width="2" data-tt="${label}"/>` +

    } else if (r.cat === "hit") {
      shape = `<circle cx="${x}" cy="${y}" r="6" fill="var(--hit)" stroke="var(--surface)" stroke-width="2" data-tt="${label}"/>`;
    } else {
      shape = `<g data-tt="${label}" stroke="var(--out)" stroke-width="2.4" stroke-linecap="round">` +
        `<line x1="${x-4.5}" y1="${y-4.5}" x2="${x+4.5}" y2="${y+4.5}"/><line x1="${x-4.5}" y1="${y+4.5}" x2="${x+4.5}" y2="${y-4.5}"/>` +
        `<circle cx="${x}" cy="${y}" r="9" fill="transparent" stroke="none"/></g>`;
    }

  }).join("");
  return `
  <svg viewBox="0 0 400 385" role="img" aria-label="打球方向チャート" style="width:100%;max-width:420px;display:block;margin:0 auto">
    <path d="M 200 370 L 30 200 A 240 240 0 0 1 370 200 Z" fill="var(--surface2)" stroke="var(--line)" stroke-width="1.5"/>
    <path d="M 200 370 L 270 300 L 200 230 L 130 300 Z" fill="none" stroke="var(--ink3)" stroke-width="1.2" opacity=".55"/>
    <circle cx="200" cy="300" r="10" fill="none" stroke="var(--ink3)" stroke-width="1" opacity=".5"/>
    ${["左","中","右"].map(d => { const [x,y] = FIELD_POS[d]; return `<text class="jp" x="${x}" y="${y - 16}" text-anchor="middle" font-size="11" opacity=".8">${d}</text>`; }).join("")}
    ${marks}
  </svg>
  <div class="legend">
    <span class="li"><span class="dot" style="background:var(--hit)"></span>単打</span>
    <span class="li"><span class="dot" style="background:var(--xbh)"></span>長打（二塁打以上）</span>
    <span class="li"><span style="color:var(--out);font-weight:800">✕</span>アウト・その他</span>
  </div>
  ${batted.length ? "" : `<div class="empty">打球データがまだありません</div>`}`;
}

function trendChartSVG(pid) {
  const games = sortedGames();
  const pts = [];
  let acc = [];
  for (const g of games) {
    const gAbs = state.atBats.filter(a => a.gameId === g.id && a.playerId === pid);
    if (!gAbs.length) continue;
    acc = acc.concat(gAbs);
    const s = calcStats(acc);
    if (s.ab > 0) pts.push({ g, avg: s.avg, ab: s.ab, h: s.h });
  }
  if (pts.length < 2) return `<div class="empty">2試合以上のデータで推移が表示されます</div>`;
  const W = 480, H = 180, mL = 44, mR = 16, mT = 14, mB = 30;
  const maxY = Math.max(0.5, ...pts.map(p => p.avg)) * 1.1;
  const X = i => mL + (W - mL - mR) * (pts.length === 1 ? .5 : i / (pts.length - 1));
  const Y = v => mT + (H - mT - mB) * (1 - v / maxY);
  const grid = [];
  for (let v = 0.1; v < maxY; v += 0.1) {
    grid.push(`<line x1="${mL}" x2="${W - mR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>` +
      `<text x="${mL - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10">${fmtRate(v)}</text>`);
  }
  const path = pts.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.avg)).join(" ");
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${X(i)}" cy="${Y(p.avg)}" r="${last ? 5 : 4}" fill="var(--hit)" stroke="var(--surface)" stroke-width="2"
      data-tt="${esc(vsLabel(p.g.opponent))}（${fmtDate(p.g.date)}）<br>通算 <span class='tt-num'>${p.h}/${p.ab}</span> 打率 <span class='tt-num'>${fmtRate(p.avg)}</span>"/>` +
      (last ? `<text x="${X(i)}" y="${Y(p.avg) - 10}" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--hit)">${fmtRate(p.avg)}</text>` : "");
  }).join("");
  const xlabels = pts.map((p, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10">${fmtDate(p.g.date)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="打率の推移" style="width:100%;display:block">
    ${grid.join("")}
    <line x1="${mL}" x2="${W - mR}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink3)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--hit)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${xlabels}
  </svg>
  <div class="chart-note">試合終了時点の通算打率</div>`;
}

  <div class="card">
    <h2>個人成績（選手をタップで詳細）</h2>
    <div class="tbl-wrap">
    <table class="stats">
      <thead><tr>${cols.map(([k, l]) =>
        `<th data-sort="${k}" class="${sortKey === k ? "sorted" : ""}">${l}${sortKey === k ? (sortDesc ? " ▾" : " ▴") : ""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(({ p, s }) => `
        <tr class="rowlink" data-player="${p.id}">
          <td class="name">${p.number != null ? `<span class="num" style="color:var(--ink3);margin-right:6px">${p.number}</span>` : ""}${esc(p.name)}</td>
          <td>${s.pa}</td><td>${s.ab}</td><td>${s.h}</td><td>${s.hr}</td><td>${s.rbi}</td><td>${s.run}</td>
          <td>${s.bb4d}</td><td>${s.so}</td><td>${s.sb}</td>
          <td><b>${fmtRate(s.avg)}</b></td><td>${fmtRate(s.obp)}</td><td>${fmtRate(s.ops)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>
  </div>`;
}

/* — 選手詳細 — */
function viewPlayer(pid) {
  const p = playerOf(pid);
  if (!p) return `<div class="empty">選手が見つかりません</div>`;
  const abs = absOfPlayer(pid);
  const s = calcStats(abs);
  const games = sortedGames().filter(g => abs.some(a => a.gameId === g.id));
  const fds = fieldingOfPlayer(pid);
  const posCount = {}; let fdErr = 0;
  fds.forEach(f => { (f.positions || []).forEach(x => { posCount[x] = (posCount[x] || 0) + 1; }); fdErr += f.errors || 0; });
  return `
  <button class="btn small back" id="back-stats">← 成績一覧へ</button>
  <div class="hdr-flex" style="margin-bottom:10px">
    <h2 style="margin:0;font-size:21px">${p.number != null ? `<span class="num" style="color:var(--ink3)">#${p.number}</span> ` : ""}${esc(p.name)}</h2>
    ${p.bats ? `<span class="subtle">${esc(p.bats)}打ち</span>` : ""}
    <span class="subtle">${games.length}試合 ${s.pa}打席</span>
  </div>
  <div class="tiles" style="margin-bottom:14px">
    <div class="tile"><div class="t-label">打率</div><div class="t-value">${fmtRate(s.avg)}</div><div class="t-sub">${s.h}/${s.ab}</div></div>
    <div class="tile"><div class="t-label">出塁率</div><div class="t-value">${fmtRate(s.obp)}</div></div>
    <div class="tile"><div class="t-label">OPS</div><div class="t-value">${fmtRate(s.ops)}</div></div>
    <div class="tile"><div class="t-label">打点</div><div class="t-value">${s.rbi}</div></div>
    <div class="tile"><div class="t-label">本塁打</div><div class="t-value">${s.hr}</div></div>
  </div>
  <div class="card">
    <h2>詳細スタッツ</h2>
    <div class="statgrid">
      ${[
        ["打率", fmtRate(s.avg)], ["試合", s.games], ["打席", s.pa], ["打数", s.ab],
        ["安打", s.h], ["二塁打", s.b2], ["三塁打", s.b3], ["本塁打", s.hr],
        ["塁打", s.tb], ["打点", s.rbi], ["得点", s.run], ["三振", s.so],
        ["四球", s.bb], ["死球", s.hbp], ["犠打", s.sac], ["犠飛", s.sf],
        ["盗塁", s.sb], ["盗塁死", s.cs], ["併殺打", s.dp],
        ["出塁率", fmtRate(s.obp)], ["長打率", fmtRate(s.slg)], ["OPS", fmtRate(s.ops)],
        ["失策", fdErr],
      ].map(([l, v]) => `<div class="sg-cell"><span class="sg-l">${l}</span><span class="sg-v num">${v}</span></div>`).join("")}
    </div>
  </div>
  <div class="card"><h2>守備</h2>
    ${fds.length ? `
      <div class="chips">${Object.entries(posCount).map(([pos, n]) => `<span class="chip" style="pointer-events:none">${esc(pos)}<span class="num" style="margin-left:4px;opacity:.7">×${n}</span></span>`).join("")}</div>
      <div class="subtle num" style="margin-top:8px">失策 ${fdErr} ・ 守備記録 ${fds.length}試合分</div>`
    : `<div class="empty">守備の記録はまだありません（各試合ページの「スタメン・守備」から登録できます）</div>`}
  </div>
  <div class="card"><h2>打球方向</h2>${sprayChartSVG(abs)}</div>
  <div class="card"><h2>打率の推移</h2>${trendChartSVG(pid)}</div>
  <div class="card"><h2>結果の内訳</h2>${resultBreakdownHTML(abs)}</div>
  <div class="card">
    <h2>打席の内容（新しい試合から）</h2>
    ${[...games].reverse().map(g => {
      const gAbs = abs.filter(a => a.gameId === g.id).sort((a, b) => a.inning - b.inning);
      const gs = calcStats(gAbs);
      return `<div style="margin-bottom:12px">
        <div class="hdr-flex"><b>${fmtDate(g.date)} ${esc(vsLabel(g.opponent))}</b>
          <span class="subtle num">${gs.h}安打/${gs.ab}打数${gs.rbi ? "・" + gs.rbi + "打点" : ""}</span></div>
        ${gAbs.map(a => paRowHTML(a)).join("")}
      </div>`;
    }).join("") || `<div class="empty">まだ打席がありません</div>`}
  </div>`;
}

function paRowHTML(a, withName) {
  const p = playerOf(a.playerId);
  return `<div class="pa-row">
    <span class="pa-inning">${a.inning}回</span>
    ${withName ? `<span class="pa-name">${esc(p ? p.name : "?")}</span>` : ""}
    <span class="badge ${resultBadgeClass(a.result)}">${esc(a.result)}</span>
    <span class="pa-detail">${[a.direction ? esc(a.direction) + "方向" : null, a.rbi ? a.rbi + "打点" : null, a.sb ? "盗塁" + (a.sb > 1 ? a.sb : "") : null, a.cs ? "盗塁死" : null, a.run ? "得点" : null].filter(Boolean).join("・")}</span>
    ${a.note ? `<span class="pa-note">⚠ ${esc(a.note)}</span>` : ""}
    <span class="pa-actions">
      <button class="icon-btn" data-edit-ab="${a.id}" aria-label="編集">編集</button>
      <button class="icon-btn del" data-del-ab="${a.id}" aria-label="削除">削除</button>
    </span>
  </div>`;
}

function lineupCardHTML(g, side) {
  const rows = fieldingOfGame(g.id)
    .filter(f => side ? f.side === side : true)
    .sort((a, b) => (a.order || 99) - (b.order || 99));
  const title = side ? `スタメン・守備（${side === "T" ? "先攻・表" : "後攻・裏"}）` : "スタメン・守備";
  return `<div class="card"><h2>${title}</h2>
    ${rows.length ? `<div class="tbl-wrap"><table class="lineup">
      <thead><tr><th>打順</th><th>選手</th><th>守備</th><th>失策</th><th></th></tr></thead>
      <tbody>${rows.map(f => {
        const p = playerOf(f.playerId);
        return `<tr>
          <td class="num">${f.order || "−"}</td>
          <td class="lu-name">${esc(p ? p.name : "?")}${p && p.bats ? `<span class="lu-bats">${esc(p.bats)}</span>` : ""}</td>
          <td>${(f.positions || []).map(esc).join(" → ") || "−"}${f.note ? ` <span class="warn-text" title="${esc(f.note)}">⚠</span>` : ""}</td>
          <td class="num">${f.errors || 0}</td>
          <td style="text-align:right;white-space:nowrap"><button class="icon-btn" data-edit-fd="${f.id}">編集</button><button class="icon-btn del" data-del-fd="${f.id}">削除</button></td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>` : `<div class="empty">まだ登録がありません</div>`}
    <button class="btn small" data-add-fd="${side || ""}" data-add-fd-game="${g.id}" style="margin-top:8px">＋ 選手を追加</button>
  </div>`;
}

/* — 試合 — */
function viewGames() {
  const games = sortedGames().reverse();
  return `
  <div class="card">
    <h2>試合一覧</h2>
    ${games.length ? games.map(g => {
      const wl = g.scoreFor > g.scoreAgainst ? ["w","勝"] : g.scoreFor < g.scoreAgainst ? ["l","負"] : ["d","分"];
      return `<div class="game-row" data-game="${g.id}">
        <span class="game-date">${esc(g.date || "")}</span>
        <span class="game-wl ${wl[0]}">${wl[1]}</span>
        <span class="game-vs">${esc(vsLabel(g.opponent))}</span>
        <span class="game-score">${g.scoreFor} - ${g.scoreAgainst}</span>
      </div>`;
    }).join("") : `<div class="empty">まだ試合がありません。「打席入力」か「取り込み」から追加できます。</div>`}
  </div>`;
}

function viewGame(gid) {
  const g = gameOf(gid);
  if (!g) return `<div class="empty">試合が見つかりません</div>`;
  const abs = absOfGame(gid).sort((a, b) => a.inning - b.inning || a.id.localeCompare(b.id));
  const split = isSplitGame(g);
  const innings = [...new Set(abs.map(a => a.inning))].sort((a, b) => a - b);
  const needCheck = abs.filter(a => a.note).length;

  let summaryHTML, inningsHTML;
  if (split) {
    const sT = calcStats(abs.filter(a => a.side === "T"));
    const sB = calcStats(abs.filter(a => a.side === "B"));
    const runsOf = (side, inn) => abs.filter(a => a.side === side && a.inning === inn && a.run).length;
    summaryHTML = `
    <div class="tbl-wrap" style="margin-top:8px">
      <table class="line-score">
        <thead><tr><th></th>${innings.map(i => `<th>${i}</th>`).join("")}<th>計</th><th class="ls-stat">安打</th></tr></thead>
        <tbody>
          <tr><td class="ls-team">先攻（表）</td>${innings.map(i => `<td>${runsOf("T", i)}</td>`).join("")}<td class="ls-total">${g.scoreFor}</td><td class="ls-stat">${sT.h}</td></tr>
          <tr><td class="ls-team">後攻（裏）</td>${innings.map(i => `<td>${runsOf("B", i)}</td>`).join("")}<td class="ls-total">${g.scoreAgainst}</td><td class="ls-stat">${sB.h}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="subtle num" style="margin-top:6px">表: ${sT.h}安打/${sT.ab}打数（${fmtRate(sT.avg)}）　裏: ${sB.h}安打/${sB.ab}打数（${fmtRate(sB.avg)}）</div>`;
    const halves = [];
    for (const inn of innings) {
      for (const side of ["T", "B"]) {
        const rows = abs.filter(a => a.inning === inn && (a.side === side || (!a.side && side === "T")));
        if (!rows.length) continue;
        const r = rows.filter(a => a.run).length;
        halves.push(`
        <div class="card">
          <h2>${inn}回${SIDE_LABEL[side]}の攻撃${r ? `<span class="h2-runs num">${r}得点</span>` : ""}</h2>
          ${rows.map(a => paRowHTML(a, true)).join("")}
        </div>`);
      }
    }
    inningsHTML = halves.join("") || `<div class="empty">打席がまだありません</div>`;
  } else {
    const s = calcStats(abs);
    summaryHTML = `<div class="subtle num">チーム: ${s.h}安打 / ${s.ab}打数（${fmtRate(s.avg)}）・四死球${s.bb4d}・三振${s.so}</div>`;
    inningsHTML = innings.map(inn => `
    <div class="card">
      <h2>${inn}回の攻撃</h2>
      ${abs.filter(a => a.inning === inn).map(a => paRowHTML(a, true)).join("")}
    </div>`).join("") || `<div class="empty">打席がまだありません</div>`;
  }

  return `
  <button class="btn small back" id="back-games">← 試合一覧へ</button>
  <div class="card">
    <div class="hdr-flex">
      <h2 style="font-size:16px;letter-spacing:0;color:var(--ink)">${esc(g.date || "")}　${esc(vsLabel(g.opponent))}</h2>
      <span class="spacer"></span>
      <span class="num" style="font-size:22px">${g.scoreFor} - ${g.scoreAgainst}</span>
    </div>
    ${summaryHTML}
    ${needCheck ? `<div class="warn-text" style="margin-top:6px">⚠ 要確認の打席が ${needCheck} 件あります（AI読み取り分）。各行の「編集」で直せます。</div>` : ""}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small primary" id="add-ab-here">この試合に打席を追加</button>
      <button class="btn small" id="edit-game">試合情報を編集</button>
      <button class="btn small danger" id="del-game">試合を削除</button>
    </div>
  </div>
  ${split ? lineupCardHTML(g, "T") + lineupCardHTML(g, "B") : lineupCardHTML(g, null)}
  ${inningsHTML}`;
}

/* — 打席入力 — */

      </div>

        ${RESULT_KEYS.map(k => `<button class="chip ${catCls(k)} ${form.result === k ? "on" : ""}" data-res="${k}">${k}</button>`).join("")}
      </div>

    <div class="field"><label>打球方向（任意）</label>

/* — 取り込み — */
let importPreview = null;

  return `あなたは野球スコアブックの読み取りアシスタントです。添付した紙のスコアブックの写真を読み取り、次のJSONだけを出力してください（説明文・コードブロック記号は不要）。

{
  "game": { "date": "YYYY-MM-DD", "opponent": "相手チーム名", "scoreFor": 自チームの得点, "scoreAgainst": 相手の得点 },
  "atBats": [
    { "player": "選手名", "number": 背番号または null, "inning": 回, "result": "結果", "direction": "方向", "rbi": 打点, "run": 本人が得点したら true, "sb": 盗塁数, "cs": 盗塁死数, "note": "" }
  ],
  "fielding": [
    { "player": "選手名", "order": 打順, "positions": ["守備位置"], "errors": 失策数, "bats": "右" または "左", "note": "" }
  ]
}

ルール:
- result は必ず次のいずれか: ${RESULT_KEYS.join(" / ")}
- direction は打球の方向で、次のいずれか（打球がない場合は空文字 ""）: ${DIRS.join(" / ")}
- 自チームの攻撃の打席だけを、イニング順にすべて出力する
- 盗塁: ダイヤモンドの辺に沿った黒の「S」「S'」記号は盗塁。その打者の sb に個数を入れる（なければ0）。盗塁でタッチアウト（TO等）になった場合は cs に個数
- 守備: 「シート」「先発」列の数字は守備位置（1=投 2=捕 3=一 4=二 5=三 6=遊 7=左 8=中 9=右）。fielding の positions に漢字で入れる。数字が2つ並ぶ場合は途中交代なので順に並べる
- 「打ち方」列の R は bats:"右"、L は bats:"左"
- 失策: 守備中のエラー（E記号が相手打者の枠に付く）が誰のものか特定できる場合のみ errors に計上。不明なら0のままにして note に書く
- 安打の赤線がダイヤモンドの辺を何本なぞっているかで単打/二塁打/三塁打を判定する（1辺=単打、2辺=二塁打、3辺=三塁打、全周+打撃での生還=本塁打）
- 読み取りに自信がない打席は note に「要確認: 理由」を書く（自信があれば空文字）
- 選手名は次の登録名簿の表記に合わせる: ${roster || "（名簿未登録。読み取った名前をそのまま使う）"}
- 自チーム名: ${state.teamName || "不明"}`;
}

function parseImport(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { return { error: "JSONとして読めませんでした。コピー漏れがないか確認してください。\n" + e.message }; }
  if (data && data.players && data.games && data.atBats) return { backup: data };
  if (!data || typeof data !== "object" || !data.game || !Array.isArray(data.atBats))
    return { error: '形式が違います。"game" と "atBats" を含むJSONを貼り付けてください。' };
  const errs = [], warns = [];
  const g = data.game;
  if (!g.opponent) warns.push("相手チーム名がありません");
  const abs = data.atBats.map((a, i) => {
    const row = { ...a };
    if (!RESULTS[row.result]) errs.push(`${i + 1}件目: result "${row.result}" は使えません`);
    if (row.direction && !DIRS.includes(row.direction)) { warns.push(`${i + 1}件目: direction "${row.direction}" は無視しました`); row.direction = ""; }
    row.inning = Math.max(1, parseInt(row.inning, 10) || 1);
    row.rbi = Math.max(0, parseInt(row.rbi, 10) || 0);
    row.run = !!row.run;
    row.note = typeof row.note === "string" ? row.note : "";
    row.side = (row.side === "表" || row.side === "T") ? "T" : (row.side === "裏" || row.side === "B") ? "B" : undefined;
    row.sb = Math.max(0, parseInt(row.sb, 10) || 0);
    row.cs = Math.max(0, parseInt(row.cs, 10) || 0);
    if (!row.player) errs.push(`${i + 1}件目: player（選手名）がありません`);
    return row;
  });
  if (errs.length) return { error: errs.join("\n") };
  const fielding = Array.isArray(data.fielding) ? data.fielding.map((f, i) => {
    const row = { ...f };
    if (!row.player) { warns.push(`守備${i + 1}件目: player（選手名）がないため無視しました`); return null; }
    row.order = Math.max(0, parseInt(row.order, 10) || 0);
    row.errors = Math.max(0, parseInt(row.errors, 10) || 0);
    row.positions = (Array.isArray(row.positions) ? row.positions : []).filter(x => DIRS.includes(x));
    row.bats = (row.bats === "右" || row.bats === "左") ? row.bats : undefined;
    row.side = (row.side === "表" || row.side === "T") ? "T" : (row.side === "裏" || row.side === "B") ? "B" : undefined;
    row.note = typeof row.note === "string" ? row.note : "";
    return row;
  }).filter(Boolean) : [];
  const knownNames = new Set(state.players.map(p => p.name));
  const newPlayers = [...new Set([...abs.map(a => a.player), ...fielding.map(f => f.player)])].filter(n => !knownNames.has(n));
  return { game: g, abs, fielding, warns, newPlayers };
}

function doImport(pv) {
  const gid = uid("g");
  state.games.push({
    id: gid,
    date: pv.game.date || "",
    opponent: pv.game.opponent || "不明",
    scoreFor: parseInt(pv.game.scoreFor, 10) || 0,
    scoreAgainst: parseInt(pv.game.scoreAgainst, 10) || 0,
  });
  const byName = {};
  state.players.forEach(p => { byName[p.name] = p; });
  for (const name of pv.newPlayers) {
    const src = pv.abs.find(a => a.player === name);
    const pl = { id: uid("p"), name, number: src && src.number != null ? parseInt(src.number, 10) || null : null };
    state.players.push(pl); byName[name] = pl;
  }
  if (!state.fielding) state.fielding = [];
  for (const f of pv.fielding || []) {
    const pl = byName[f.player]; if (!pl) continue;
    if (f.bats && pl.bats === undefined) pl.bats = f.bats;
    state.fielding.push({
      id: uid("f"), gameId: gid, playerId: pl.id, side: f.side,
      order: f.order, positions: f.positions, errors: f.errors, note: f.note || "",
    });
  }
  for (const a of pv.abs) {
    state.atBats.push({
      id: uid("ab"), gameId: gid, playerId: byName[a.player].id,
      inning: a.inning, result: a.result, direction: a.direction || "",
      rbi: a.rbi, run: a.run, sb: a.sb || 0, cs: a.cs || 0, note: a.note || "", side: a.side,
    });
  }
  save();
  return gid;
}

function editFieldingPrompts(f) {
  const ord = prompt("打順（数字）", f.order || ""); if (ord === null) { save(); render(); return; }
  const pos = prompt("守備位置（例: 遊 ／ 途中交代があれば 遊→三）", (f.positions || []).join("→")); if (pos === null) { save(); render(); return; }
  const err = prompt("失策数", f.errors || 0); if (err === null) { save(); render(); return; }
  f.order = parseInt(ord, 10) || 0;
  f.positions = pos.split(/[→,、\s\/]+/).filter(Boolean).filter(x => DIRS.includes(x));
  f.errors = Math.max(0, parseInt(err, 10) || 0);
  f.note = "";
  save(); render(); showToast("守備情報を保存しました");
}

    const name = prompt("選手名"); if (!name) return;

    state.fielding.push(f);
    editFieldingPrompts(f);
  }));
  /* PA row edit/delete (player & game views) */
  main.querySelectorAll("[data-edit-ab]").forEach(b => b.addEventListener("click", e => {

  }));

    e.stopPropagation();

    save(); render(); showToast("打席を削除しました");

  /* input form */
  const fg = $("#f-game"); if (fg) fg.addEventListener("change", () => { form.gameId = fg.value; form.side = ""; render(); });
  main.querySelectorAll("#f-sides [data-side]").forEach(c => c.addEventListener("click", () => { form.side = c.dataset.side; render(); }));
  const mkNG = $("#mk-newgame"); if (mkNG) mkNG.addEventListener("click", e => { e.preventDefault(); form.newGame = true; render(); });
  const cNG = $("#cancel-newgame"); if (cNG) cNG.addEventListener("click", e => { e.preventDefault(); form.newGame = false; render(); });
  main.querySelectorAll("#f-players [data-pl]").forEach(c => c.addEventListener("click", () => { form.playerId = c.dataset.pl; render(); }));
  const addP = $("#add-player"); if (addP) addP.addEventListener("click", () => {
    const name = prompt("選手名"); if (!name) return;
    const numS = prompt("背番号（なければ空欄）") || "";
    const pl = { id: uid("p"), name: name.trim(), number: numS.trim() === "" ? null : parseInt(numS, 10) };
    state.players.push(pl); form.playerId = pl.id; save(); render();
  });
  const step = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  step("#inn-up", () => { form.inning = Math.min(15, form.inning + 1); render(); });
  step("#inn-dn", () => { form.inning = Math.max(1, form.inning - 1); render(); });
  step("#rbi-up", () => { form.rbi = Math.min(4, form.rbi + 1); render(); });
  step("#rbi-dn", () => { form.rbi = Math.max(0, form.rbi - 1); render(); });
  step("#sb-up", () => { form.sb = Math.min(3, (form.sb || 0) + 1); render(); });
  step("#sb-dn", () => { form.sb = Math.max(0, (form.sb || 0) - 1); render(); });
  step("#cs-up", () => { form.cs = Math.min(2, (form.cs || 0) + 1); render(); });
  step("#cs-dn", () => { form.cs = Math.max(0, (form.cs || 0) - 1); render(); });
  const frun = $("#f-run"); if (frun) frun.addEventListener("change", () => { form.run = frun.checked; });
  main.querySelectorAll("#f-results [data-res]").forEach(c => c.addEventListener("click", () => { form.result = c.dataset.res; render(); }));
  main.querySelectorAll("#f-dirs [data-dir]").forEach(c => c.addEventListener("click", () => { form.direction = c.dataset.dir; render(); }));
  const cancelE = $("#cancel-edit"); if (cancelE) cancelE.addEventListener("click", () => {
    form = { gameId: null, playerId: null, inning: 1, result: null, direction: "", rbi: 0, run: false, newGame: false };
    go({ tab: "games", editAbId: null, gameId: route.gameId });
  });
  const submit = $("#submit-ab"); if (submit) submit.addEventListener("click", () => {
    if (form.newGame) {

    if (!form.playerId) { showToast("選手を選んでください"); return; }
    if (!form.result) { showToast("結果を選んでください"); return; }

      if (a) Object.assign(a, { gameId: form.gameId, playerId: form.playerId, inning: form.inning, result: form.result, direction: form.direction, rbi: form.rbi, run: form.run, sb: form.sb || 0, cs: form.cs || 0, note: "", side: sideVal });
      save();
      const gid = a ? a.gameId : null;

      state.atBats.push({ id: uid("ab"), gameId: form.gameId, playerId: form.playerId, inning: form.inning, result: form.result, direction: form.direction, rbi: form.rbi, run: form.run, sb: form.sb || 0, cs: form.cs || 0, note: "", side: sideVal });

      <button class="btn primary" id="do-import" style="margin-top:10px">この内容で取り込む</button>

    $("#do-import").addEventListener("click", () => {

    state.teamName = setTN.value.trim(); save(); $("#team-name-h").textContent = state.teamName || "チーム";
  });
  const bkCopy = $("#backup-copy"); if (bkCopy) bkCopy.addEventListener("click", async () => {

    catch (e) { showToast("コピーできませんでした"); }
  });
  const bkDl = $("#backup-dl");
  if (bkDl && window.claude && window.claude.downloads) {
    bkDl.style.display = "";
    bkDl.addEventListener("click", async () => {
      try {
        await window.claude.downloads.save({ filename: "scorebook-backup.json", data: JSON.stringify(state, null, 1) });

      } catch (e) { showToast("保存はキャンセルされました"); }

  }
  const restoreB = $("#restore"); if (restoreB) restoreB.addEventListener("click", () => {
    const res = parseImport($("#import-json").value.trim());
    if (!res.backup) { showToast("テキスト欄にバックアップJSONを貼り付けてください"); return; }
    if (!confirm("現在のデータをすべて置き換えます。チーム全員の共有データにも反映されます。よろしいですか?")) return;
